</script><script>const DATA = window.WIKI_DATA;
const escapeText = value => String(value).replace(/[&<>"']/g, character => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character]));
const PIECES = {k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"};
const NAMES = {k:"王",q:"后",r:"車",b:"象",n:"馬",p:"兵"};

function boardHTML(fen, focus = []) {
  const rows = fen.split(" ")[0].split("/");
  const labels = [];
  let cells = "";
  rows.forEach((row, rowIndex) => {
    let column = 0;
    for (const character of row) {
      const count = /[1-8]/.test(character) ? Number(character) : 1;
      for (let empty = 0; empty < count; empty++) {
        const piece = /[1-8]/.test(character) ? "" : character;
        const file = "abcdefgh"[column];
        const rank = 8 - rowIndex;
        const square = file + rank;
        const color = piece === piece.toUpperCase() ? "white" : "black";
        if (piece) labels.push(square + (color === "white" ? "白" : "黑") + NAMES[piece.toLowerCase()]);
        cells += `<span aria-hidden="true" class="square ${(rowIndex + column) % 2 ? "dark" : "light"} ${piece ? color : ""} ${focus.includes(square) ? "marked" : ""}" ${column === 0 ? `data-rank="${rank}"` : ""} ${rank === 1 ? `data-file="${file}"` : ""}>${PIECES[piece.toLowerCase()] ?? ""}</span>`;
        column++;
      }
    }
  });
  return `<div class="board" role="img" aria-label="${escapeText(labels.join("、") + (focus.length ? "。標記格 " + focus.join("、") : ""))}">${cells}</div>`;
}

function sourceLinks(note) {
  return `<div class="sources-line">Wiki <a href="./wiki.html?topic=${note.id}">${escapeText(note.title)}</a>來源 ${note.sourceIds.map(id => `<a href="./sources.html#${id}">${id}</a>`).join("")}</div>`;
}

function mountExample(container, note, interactive = true) {
  container.innerHTML = `<figure class="board-figure"><div class="board-host"></div><figcaption aria-live="polite"></figcaption></figure>`;
  let step = 0;
  const board = container.querySelector(".board-host");
  const caption = container.querySelector("figcaption");
  const show = () => {
    const state = note.states[step];
    board.innerHTML = boardHTML(state.fen, step ? note.focus : []);
    caption.textContent = step ? `示範第 ${step} 步 · ${state.label}` : `自製局面 · ${note.fen.split(" ")[1] === "w" ? "白方" : "黑方"}行棋`;
  };
  if (interactive && note.states.length > 1) {
    const controls = document.createElement("div");
    controls.className = "board-controls";
    controls.innerHTML = '<button type="button">下一步示範</button><button type="button">重設棋盤</button>';
    const [next, reset] = controls.querySelectorAll("button");
    next.addEventListener("click", () => {
      step++;
      show();
      next.disabled = step === note.states.length - 1;
    });
    reset.addEventListener("click", () => { step = 0; next.disabled = false; show(); });
    container.append(controls);
  }
  show();
}

function mountQuiz(container, note) {
  container.className = "quiz";
  container.innerHTML = `<h3 id="question-${note.id}">${escapeText(note.question)}</h3><div class="options" role="group" aria-labelledby="question-${note.id}"></div><div class="feedback" role="status"></div><button type="button" class="reset-quiz" hidden>重新作答</button>`;
  const options = container.querySelector(".options");
  const feedback = container.querySelector(".feedback");
  const reset = container.querySelector(".reset-quiz");
  note.choices.forEach((choice, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = choice;
    button.setAttribute("aria-pressed", "false");
    button.addEventListener("click", () => {
      options.querySelector('[aria-pressed="true"]')?.setAttribute("aria-pressed", "false");
      button.setAttribute("aria-pressed", "true");
      feedback.textContent = (index === note.answer ? "答對了。" : "再想想。") + note.explanation;
      reset.hidden = false;
    });
    options.append(button);
  });
  reset.addEventListener("click", () => {
    feedback.textContent = "";
    options.querySelector('[aria-pressed="true"]')?.setAttribute("aria-pressed", "false");
    reset.hidden = true;
    options.firstElementChild.focus();
  });
}
</script><script>const deck = document.querySelector("#deck");

addSlide(`<div class="slide-grid"><div><p class="eyebrow">給西洋棋初學者的教學簡報</p><h1>西洋棋<br>戰術入門</h1><p class="cover-line">五個基本戰術</p><p class="lead">認識雙攻、牽制、串擊、閃擊與底線將死。每個主題都有自製棋局和一道練習。</p><p class="cover-caption">知識來源為本專案的 <a href="./index.html">LLM Wiki</a>。先讀概念，再用「下一步示範」觀察棋子變化。</p></div><figure class="board-figure">${boardHTML(DATA.notes[0].fen)}<figcaption>自製局面 · 白方行棋</figcaption></figure></div>`, "西洋棋戰術入門");

addSlide(`<div class="slide-grid"><div><h2>棋盤與走法記號</h2><p class="lead">下方是白方。左右為 a–h，上下為 1–8。e5 就是 e 線與第 5 橫列交會的格子。</p><p class="detail">K 王、Q 后、R 車、B 象、N 馬。兵的走法通常省略棋子代號。<br>「x」代表吃子，「+」代表將軍，「#」代表將死。</p><div class="standout">Nf7+ 表示騎士走到 f7，並將軍。</div>${sourceLinks(DATA.notes[0])}<p class="sources-line">記號和座標以本專案的合法棋步示範。</p></div><figure class="board-figure">${boardHTML(DATA.notes[0].fen, ["e5", "f7"])}<figcaption>e5 的白馬，準備跳到 f7</figcaption></figure></div>`, "棋盤與走法記號");

const previous = document.querySelector("#previous");
const next = document.querySelector("#next");
let current = 0;
function showSlide(index) {
  current = Math.min(sections.length - 1, Math.max(0, index));
  sections.forEach((section, i) => { section.hidden = i !== current; });
  previous.disabled = current === 0;
  next.disabled = current === sections.length - 1;
  document.querySelector("#slide-count").textContent = `${current + 1} / ${sections.length}`;
  const progress = document.querySelector("#slide-progress");
  progress.max = sections.length;
  progress.value = current + 1;
  document.title = `${current + 1}. ${sections[current].getAttribute("aria-label")} · 棋盤筆記`;
}
function navigate(index) {
  showSlide(index);
  history.replaceState(null, "", `#slide-${current + 1}`);
  window.scrollTo(0, 0);
}
function readHash() {
  const match = /^#slide-(\d+)$/.exec(location.hash);
  showSlide(match ? Number(match[1]) - 1 : 0);
}
previous.addEventListener("click", () => navigate(current - 1));
next.addEventListener("click", () => navigate(current + 1));
window.addEventListener("hashchange", readHash);
document.addEventListener("keydown", event => {
  if (event.target.closest("button,a,input,textarea,select")) return;
  if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") { event.preventDefault(); navigate(current + 1); }
  if (event.key === "ArrowLeft" || event.key === "PageUp") { event.preventDefault(); navigate(current - 1); }
  if (event.key === "Home") { event.preventDefault(); navigate(0); }
  if (event.key === "End") { event.preventDefault(); navigate(sections.length - 1); }
});
document.querySelector("#fullscreen").addEventListener("click", async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();

    document.querySelector("#deck-status").textContent = "瀏覽器無法開啟全螢幕。你仍可使用上一頁與下一頁瀏覽。";
  }
});
document.addEventListener("fullscreenchange", () => {
  document.querySelector("#fullscreen").textContent = document.fullscreenElement ? "離開全螢幕" : "全螢幕";
});
readHash();
